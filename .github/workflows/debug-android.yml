name: Debug Android build
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build and capture log
        id: build
        working-directory: android
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace > "$RUNNER_TEMP/build.log" 2>&1
          code=$?
          tail -c 200000 "$RUNNER_TEMP/build.log" > "$GITHUB_WORKSPACE/ci-android-build.log"
          echo "exit=$code" >> "$GITHUB_WORKSPACE/ci-android-build.log"
          exit $code
        continue-on-error: true
      - name: Publish log to branch
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci@flicksync.local"
          git add -f ci-android-build.log
          git commit -m "ci: android build log [skip ci]" || true
          git push origin HEAD:${GITHUB_REF_NAME} || true
