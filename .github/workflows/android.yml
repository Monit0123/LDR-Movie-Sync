name: Android APK

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "android/**"
      - "shared/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "shared/**"
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build (signed release when a keystore is configured, else debug)
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            gradle :app:assembleRelease --no-daemon \
              -PRELEASE_STORE_FILE="$RUNNER_TEMP/release.jks" \
              -PRELEASE_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
              -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
              -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD" \
              -Pflicksync.server.url="${{ vars.FLICKSYNC_SERVER_URL || 'https://your-flicksync-server.example.com' }}"
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/FlickSync.apk"
          else
            gradle :app:assembleDebug --no-daemon \
              -Pflicksync.server.url="${{ vars.FLICKSYNC_SERVER_URL || 'https://your-flicksync-server.example.com' }}"
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/FlickSync.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: FlickSync-apk
          path: ${{ runner.temp }}/FlickSync.apk
          if-no-files-found: error
