name: Release (APK + DMG)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Assemble
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SERVER="${{ vars.FLICKSYNC_SERVER_URL || 'https://your-flicksync-server.example.com' }}"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            gradle :app:assembleRelease --no-daemon \
              -PRELEASE_STORE_FILE="$RUNNER_TEMP/release.jks" \
              -PRELEASE_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
              -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
              -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD" \
              -Pflicksync.server.url="$SERVER"
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/FlickSync-${GITHUB_REF_NAME}.apk"
          else
            gradle :app:assembleDebug --no-daemon -Pflicksync.server.url="$SERVER"
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/FlickSync-${GITHUB_REF_NAME}-debug.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ runner.temp }}/*.apk
          if-no-files-found: error

  macos:
    name: macOS DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: macos
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Rename
        run: mv macos/dist/FlickSync.dmg "macos/dist/FlickSync-${GITHUB_REF_NAME}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: macos/dist/*.dmg
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [android, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: FlickSync ${{ github.ref_name }}
          generate_release_notes: true
          files: out/*
          body: |
            **Watch together, from two different places.**

            - `FlickSync-*.apk` — install on Android (allow "unknown sources")
            - `FlickSync-*.dmg` — drag FlickSync into Applications on the Mac

            Both devices need the same relay URL. See the README to deploy it in one click.
